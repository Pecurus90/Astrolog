<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>[data-sc-name^="componenti/"]{display:contents}</style></helmet>
<div class="al-c-luna__blocco-1" data-modo="{{ t.modo }}" data-accento="{{ t.acc }}">
<sc-if value="{{ pronto }}" hint-placeholder-val="{{ true }}"><sc-if value="{{ testi }}" hint-placeholder-val="{{ false }}"><span class="al-c-luna__riga-1" style="gap:{{ gap }}"><svg class="al-c-luna__grafico-1" width="{{ s }}" height="{{ s }}" viewBox="{{ vb }}" role="img" aria-label="{{ aria }}"><circle r="10" fill="{{ L.dark }}" stroke="{{ L.line }}" stroke-width="{{ sw }}"></circle><path d="{{ d }}" fill="{{ L.lit }}"></path></svg><span class="al-c-luna__colonna-1"><b class="al-c-luna__testo-1" style="font-size:{{ fs }}">{{ titolo }}</b><span class="al-c-luna__testo-2">{{ testo }}</span></span></span></sc-if><sc-if value="{{ solo }}" hint-placeholder-val="{{ true }}"><svg class="al-c-luna__grafico-1" width="{{ s }}" height="{{ s }}" viewBox="{{ vb }}" role="img" aria-label="{{ aria }}"><circle r="10" fill="{{ L.dark }}" stroke="{{ L.line }}" stroke-width="{{ sw }}"></circle><path d="{{ d }}" fill="{{ L.lit }}"></path></svg></sc-if></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:80},&quot;percento&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;default&quot;:62,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Luna&quot;},&quot;crescente&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Luna&quot;},&quot;misura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;20&quot;,&quot;22&quot;,&quot;30&quot;,&quot;34&quot;,&quot;60&quot;,&quot;76&quot;],&quot;default&quot;:&quot;30&quot;,&quot;tsType&quot;:&quot;number | string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;piena&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;titolo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testi&quot;},&quot;testo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testi&quot;},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;telefono&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scuro&quot;,&quot;chiaro&quot;],&quot;default&quot;:&quot;scuro&quot;,&quot;tsType&quot;:&quot;'scuro' | 'chiaro'&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;accento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;originale&quot;,&quot;ambra · blu notte&quot;,&quot;turchese · petrolio&quot;,&quot;corallo · terracotta&quot;,&quot;ghiaccio · indaco&quot;],&quot;default&quot;:&quot;ambra · blu notte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { this._alw && clearInterval(this._alw); }
  alPronto() { const ok = () => window.AL && window.ALsoglie && window.ALcat && window.ALdati; if (ok()) return true;
    const b = /\/componenti\/[^/]*$/.test(location.pathname) ? './' : './componenti/';
    ['tema.js', 'soglie.js', 'catalogo.js', 'dati.js'].forEach(f => { if (!document.querySelector('script[data-al="' + f + '"]')) { const s = document.createElement('script'); s.src = b + f; s.setAttribute('data-al', f); document.head.appendChild(s); } });
    if (!this._alw) this._alw = setInterval(() => { if (ok()) { clearInterval(this._alw); this._alw = null; this.forceUpdate(); } }, 25);
    return false; }
  renderVals() {
    if (!this.alPronto()) return { pronto: false };
    const p = this.props, t = AL.tema(p.modo, p.accento), s = +(p.misura ?? 30), pct = +(p.percento ?? 62), cresce = !!p.crescente;
    // Disco crema su antracite, bordo nel grigio della Luna (un tratto di circa 1 px). piena: il disco riempie il riquadro (Dashboard)
    const m = p.piena ? 10.2 : 12, sw = p.piena ? (24 / s).toFixed(2) : s <= 24 ? 1 : s <= 34 ? 0.8 : (24 / s).toFixed(2);
    const titolo = p.titolo || '', testo = p.testo || '';
    return { pronto: true, t, L: AL.LUNA, s, vb: -m + ' ' + -m + ' ' + 2 * m + ' ' + 2 * m, sw, d: AL.lunaD(pct, cresce), titolo, testo, testi: !!(titolo || testo), solo: !(titolo || testo),
      gap: s >= 34 ? '12px' : '10px', fs: p.formato === 'telefono' ? '15px' : '14px', aria: (titolo ? titolo + ', ' : '') + 'Luna illuminata ' + AL.al(pct) + pct + '%' };
  }
}
</script>
</body>
</html>
