<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>[data-sc-name^="componenti/"]{display:contents}</style></helmet>
<div class="al-c-pillola-scelta__blocco-1" data-modo="{{ t.modo }}" data-accento="{{ t.acc }}" data-formato="{{ fmt }}">
<sc-if value="{{ pronto }}" hint-placeholder-val="{{ true }}"><sc-if value="{{ segR }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="{{ etichetta }}" class="{{ cls }}" style="align-self:{{ allinea }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="2"><a href="#" role="radio" aria-checked="{{ o.sel }}" aria-disabled="{{ o.no }}" title="{{ o.titolo }}" onClick="{{ o.on }}" class="al-scelta__voce">{{ o.l }}</a></sc-for></div></sc-if><sc-if value="{{ seg }}" hint-placeholder-val="{{ false }}"><span role="tablist" aria-label="{{ etichetta }}" class="{{ cls }}" style="align-self:{{ allinea }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="2"><a href="{{ o.href }}" role="tab" aria-selected="{{ o.sel }}" title="{{ o.titolo }}" onClick="{{ o.on }}" class="al-scelta__voce">{{ o.l }}</a></sc-for></span></sc-if><sc-if value="{{ spu }}" hint-placeholder-val="{{ false }}"><span role="group" aria-label="{{ etichetta }}" class="{{ cls }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="6"><a href="#" role="checkbox" aria-checked="{{ o.sel }}" aria-disabled="{{ o.no }}" title="{{ o.titolo }}" onClick="{{ o.on }}" class="al-scelta__voce" style="--voce-colore:{{ o.colore }}"><i class="al-scelta__pallino"></i>{{ o.l }}</a></sc-for></span></sc-if><sc-if value="{{ ris }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="{{ etichetta }}" class="{{ cls }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="3"><a href="#" role="radio" aria-checked="{{ o.sel }}" aria-disabled="{{ o.no }}" onClick="{{ o.on }}" class="{{ o.rcls }}"><span aria-hidden="true" class="al-scelta__tondo"></span><span class="al-scelta__testi"><span>{{ o.l }}</span><sc-if value="{{ o.sub }}" hint-placeholder-val="{{ false }}"><span class="al-scelta__riga">{{ o.sub }}</span></sc-if></span></a></sc-for></div></sc-if><sc-if value="{{ pil }}" hint-placeholder-val="{{ true }}"><span role="group" aria-label="{{ etichetta }}" class="{{ cls }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="4"><a href="#" onClick="{{ o.on }}" aria-pressed="{{ o.sel }}" aria-disabled="{{ o.no }}" class="al-scelta__voce"><sc-if value="{{ o.sw }}" hint-placeholder-val="{{ false }}"><i class="al-scelta__tinta" style="background:{{ o.sw.bg }};border:{{ o.sw.bd }}"></i></sc-if><sc-if value="{{ o.ln }}" hint-placeholder-val="{{ false }}"><i class="al-scelta__linea" style="border-top-color:{{ o.ln }}"></i></sc-if>{{ o.l }}<sc-if value="{{ o.c }}" hint-placeholder-val="{{ false }}"><span class="al-scelta__conto">{{ o.c }}</span></sc-if></a></sc-for></span></sc-if><sc-if value="{{ pilR }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="{{ etichetta }}" class="{{ cls }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="4"><a href="#" role="radio" onClick="{{ o.on }}" aria-checked="{{ o.sel }}" aria-disabled="{{ o.no }}" class="al-scelta__voce"><sc-if value="{{ o.sw }}" hint-placeholder-val="{{ false }}"><i class="al-scelta__tinta" style="background:{{ o.sw.bg }};border:{{ o.sw.bd }}"></i></sc-if>{{ o.l }}<sc-if value="{{ o.c }}" hint-placeholder-val="{{ false }}"><span class="al-scelta__conto">{{ o.c }}</span></sc-if></a></sc-for></div></sc-if><sc-if value="{{ int }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ opz }}" as="o" hint-placeholder-count="1"><button type="button" role="switch" aria-checked="{{ o.sel }}" aria-label="{{ o.titolo }}" aria-disabled="{{ o.no }}" onClick="{{ o.on }}" class="{{ cls }}"><span class="al-interruttore__binario" aria-hidden="true"><span class="al-interruttore__pomello"></span></span><span class="al-interruttore__nome">{{ o.l }}</span></button></sc-for></sc-if></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:80},&quot;opzioni&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{l:string,sub?:string,sel?:boolean,on?:Function,c?:string,no?:boolean,tinta?:string,linea?:string,titolo?:string}&gt;&quot;},&quot;forma&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pillole&quot;,&quot;segmentato&quot;,&quot;linguette&quot;,&quot;spunta&quot;,&quot;risposta&quot;,&quot;interruttore&quot;],&quot;default&quot;:&quot;pillole&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;misura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normale&quot;,&quot;piccola&quot;],&quot;default&quot;:&quot;normale&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;fondo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;carta&quot;,&quot;carta2&quot;,&quot;vuoto&quot;,&quot;protagonista&quot;],&quot;default&quot;:&quot;carta&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;scorre&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;allinea&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;ruolo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;radio&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;'' | 'radio'&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;classe&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;etichetta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Scelta&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;telefono&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scuro&quot;,&quot;chiaro&quot;],&quot;default&quot;:&quot;scuro&quot;,&quot;tsType&quot;:&quot;'scuro' | 'chiaro'&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;accento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;originale&quot;,&quot;ambra · blu notte&quot;,&quot;turchese · petrolio&quot;,&quot;corallo · terracotta&quot;,&quot;ghiaccio · indaco&quot;],&quot;default&quot;:&quot;ambra · blu notte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { this._alw && clearInterval(this._alw); }
  alPronto() { const ok = () => window.AL && window.ALsoglie && window.ALcat && window.ALdati; if (ok()) return true;
    const b = /\/componenti\/[^/]*$/.test(location.pathname) ? './' : './componenti/';
    ['tema.js', 'soglie.js', 'catalogo.js', 'dati.js'].forEach(f => { if (!document.querySelector('script[data-al="' + f + '"]')) { const s = document.createElement('script'); s.src = b + f; s.setAttribute('data-al', f); document.head.appendChild(s); } });
    if (!this._alw) this._alw = setInterval(() => { if (ok()) { clearInterval(this._alw); this._alw = null; this.forceUpdate(); } }, 25);
    return false; }
  renderVals() {
    if (!this.alPronto()) return { pronto: false };
    const p = this.props, t = AL.tema(p.modo, p.accento), tel = p.formato === 'telefono', forma = p.forma || 'pillole', lin = forma === 'linguette', int = forma === 'interruttore', radio = p.ruolo === 'radio', seg = forma === 'segmentato' || lin, spu = forma === 'spunta', ris = forma === 'risposta', prot = p.fondo === 'protagonista';
    // forma: pillole · segmentato · linguette · spunta · risposta · interruttore (una opzione per interruttore: l il nome, titolo l'aria-label). ruolo="radio": radiogroup e aria-checked (segmentato e pillole). classe: classe di posto in piu'.
    // opzioni: { l, sel, on, href (linguette che portano a un'altra pagina), c (conto), no (spenta), tinta (filtro: pallino), linea (colore della curva), colore (spunta: colore della misura), sub (risposta: riga sotto), titolo }
    const opzioni = p.opzioni || [{ l: 'Hα', tinta: 'ha', c: '6', sel: true }, { l: 'OIII', tinta: 'oiii', c: '5' }, { l: 'SII', tinta: 'sii', c: '0', no: true }];
    const opz = opzioni.map(o => { const sel = o.sel === true || o.sel === 'true', no = !!o.no && !sel;
      return { l: o.l, href: o.href || '#', sel: sel ? 'true' : 'false', no: no ? 'true' : undefined, titolo: o.titolo || undefined, c: o.c ?? '', sw: o.tinta ? AL.tinta(t, o.tinta) : null, ln: o.linea || null,
        colore: o.colore || undefined, sub: o.sub || '', rcls: 'al-scelta__voce' + (o.sub ? ' al-scelta__voce--con-riga' : ''),
        on: e => { if (!o.href && e && e.preventDefault) e.preventDefault(); if (no) return; o.on && o.on(e); } }; });
    const cls = int ? ['al-interruttore', p.classe].filter(Boolean).join(' ') : ['al-scelta', 'al-scelta--' + (lin ? 'linguette' : seg ? 'segmentato' : spu ? 'spunta' : ris ? 'risposta' : 'pillole'), prot && 'al-scelta--su-protagonista', p.fondo === 'carta2' && 'al-scelta--fondo-carta-2', p.fondo === 'vuoto' && 'al-scelta--fondo-vuoto',
      p.misura === 'piccola' && 'al-scelta--piccola', p.scorre && 'al-scelta--scorre', p.classe].filter(Boolean).join(' ');
    return { pronto: true, t, fmt: tel ? 'telefono' : 'desktop', opz, seg: seg && !radio, segR: seg && radio, spu, ris, pil: !seg && !spu && !ris && !int && !radio, pilR: !seg && !spu && !ris && !int && radio, int, cls, etichetta: p.etichetta || 'Scelta', allinea: p.allinea || 'auto' };
  }
}
</script>
</body>
</html>
