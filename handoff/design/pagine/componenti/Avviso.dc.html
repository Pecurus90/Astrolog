<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>[data-sc-name^="componenti/"]{display:contents}</style></helmet>
<div class="al-c-avviso__blocco-1" data-modo="{{ t.modo }}" data-accento="{{ t.acc }}">
<sc-if value="{{ pronto }}" hint-placeholder-val="{{ true }}">
<sc-if value="{{ v.paginaDesk }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__griglia-1" role="status" style="grid-column:{{ col }}">
<span class="al-c-avviso__tondo-1" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span>
<span class="al-c-avviso__colonna-1"><b class="al-c-avviso__testo-1">{{ titolo }}</b><sc-if value="{{ testo }}" hint-placeholder-val="{{ true }}"><span class="al-c-avviso__testo-2">{{ testo }}</span></sc-if></span>
<sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--contorno">{{ azione }}</a></sc-if>
</div></sc-if>
<sc-if value="{{ v.paginaTel }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__colonna-2" role="status">
<span class="al-c-avviso__riga-1"><span class="al-c-avviso__tondo-2" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span><b class="al-c-avviso__testo-3">{{ titolo }}</b></span>
<sc-if value="{{ testo }}" hint-placeholder-val="{{ true }}"><span class="al-c-avviso__testo-4">{{ testo }}</span></sc-if>
<sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--contorno al-bottone--blocco">{{ azione }}</a></sc-if>
</div></sc-if>
<sc-if value="{{ v.bloccoDesk }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__griglia-2" role="status">
<span class="al-c-avviso__tondo-3" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span>
<span class="al-c-avviso__colonna-1"><b class="al-c-avviso__testo-5">{{ titolo }}</b><sc-if value="{{ testo }}" hint-placeholder-val="{{ true }}"><span class="al-c-avviso__testo-2">{{ testo }}</span></sc-if></span>
<sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--contorno">{{ azione }}</a></sc-if>
</div></sc-if>
<sc-if value="{{ v.bloccoTel }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__colonna-3" role="status" style="margin:0 {{ rientro }}">
<span class="al-c-avviso__riga-2"><span class="al-c-avviso__tondo-4" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span><b class="al-c-avviso__testo-6">{{ titolo }}</b></span>
<sc-if value="{{ testo }}" hint-placeholder-val="{{ true }}"><span class="al-c-avviso__testo-7">{{ testo }}</span></sc-if>
<sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--contorno al-bottone--blocco">{{ azione }}</a></sc-if>
</div></sc-if>
<sc-if value="{{ v.rigaDesk }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__riga-3" role="status"><span class="al-c-avviso__tondo-5" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span><span class="al-c-avviso__blocco-2">{{ titolo }}</span><sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--testo al-bottone--piccolo">{{ azione }}</a></sc-if></div></sc-if>
<sc-if value="{{ v.rigaTel }}" hint-placeholder-val="{{ false }}"><div class="al-c-avviso__colonna-4" role="status" style="margin:0 {{ rientro }}"><span class="al-c-avviso__riga-4"><span class="al-c-avviso__tondo-6" aria-hidden="true" style="background:{{ s.bg }};color:{{ s.fg }};box-shadow:inset 0 0 0 1.5px {{ s.ring }}">{{ s.segno }}</span><span class="al-c-avviso__testo-8">{{ titolo }}</span></span><sc-if value="{{ azione }}" hint-placeholder-val="{{ true }}"><a href="#" onClick="{{ onAzione }}" class="al-bottone al-bottone--testo al-bottone--blocco al-bottone--a-sinistra al-c-avviso__blocco-3">{{ azione }}</a></sc-if></div></sc-if>
</sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:160},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pagina&quot;,&quot;blocco&quot;,&quot;riga&quot;],&quot;default&quot;:&quot;blocco&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Avviso&quot;},&quot;formato&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;telefono&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Avviso&quot;},&quot;segno&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;!&quot;,&quot;?&quot;,&quot;✓&quot;],&quot;default&quot;:&quot;!&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Avviso&quot;},&quot;titolo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Meteo non raggiungibile&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testo&quot;},&quot;testo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open-Meteo non risponde dalle 14:05. Riprovo da solo ogni 15 minuti.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testo&quot;},&quot;azione&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Riprova ora&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Testo&quot;},&quot;colonne&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;rientro&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;onAzione&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scuro&quot;,&quot;chiaro&quot;],&quot;default&quot;:&quot;scuro&quot;,&quot;tsType&quot;:&quot;'scuro' | 'chiaro'&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;accento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;originale&quot;,&quot;ambra · blu notte&quot;,&quot;turchese · petrolio&quot;,&quot;corallo · terracotta&quot;,&quot;ghiaccio · indaco&quot;],&quot;default&quot;:&quot;ambra · blu notte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { this._alw && clearInterval(this._alw); }
  alPronto() { const ok = () => window.AL && window.ALsoglie && window.ALcat && window.ALdati; if (ok()) return true;
    const b = /\/componenti\/[^/]*$/.test(location.pathname) ? './' : './componenti/';
    ['tema.js', 'soglie.js', 'catalogo.js', 'dati.js'].forEach(f => { if (!document.querySelector('script[data-al="' + f + '"]')) { const s = document.createElement('script'); s.src = b + f; s.setAttribute('data-al', f); document.head.appendChild(s); } });
    if (!this._alw) this._alw = setInterval(() => { if (ok()) { clearInterval(this._alw); this._alw = null; this.forceUpdate(); } }, 25);
    return false; }
  renderVals() {
    if (!this.alPronto()) return { pronto: false };
    const p = this.props, t = AL.tema(p.modo, p.accento), tel = p.formato === 'telefono', tipo = p.tipo || 'blocco';
    // "!" qualcosa non è riuscito; "?" un dato manca; "✓" riuscito (esiti del primo avvio)
    const q = p.segno === '?';
    const ok = p.segno === '✓';
    const s = ok ? { segno: '✓', bg: t.pillOkBg, fg: t.pillOkFg, ring: 'transparent' } : q ? { segno: '?', bg: tipo === 'pagina' ? t.card2 : t.card, fg: t.text, ring: t.line } : { segno: '!', bg: t.warn, fg: t.warnFg, ring: 'transparent' };
    const v = { paginaDesk: tipo === 'pagina' && !tel, paginaTel: tipo === 'pagina' && tel, bloccoDesk: tipo === 'blocco' && !tel, bloccoTel: tipo === 'blocco' && tel, rigaDesk: tipo === 'riga' && !tel, rigaTel: tipo === 'riga' && tel };
    const num = v => typeof v === 'number' || /^\d+$/.test(String(v));
    const px = x => num(x) ? x + 'px' : x;
    return { pronto: true, t, s, v, titolo: p.titolo ?? 'Meteo non raggiungibile', testo: p.testo ?? '', azione: p.azione ?? '', onAzione: p.onAzione || (e => e.preventDefault()),
      col: p.colonne == null ? 'span 12' : (num(p.colonne) ? 'span ' + p.colonne : p.colonne), rientro: px(p.rientro ?? 0) };
  }
}
</script>
</body>
</html>
