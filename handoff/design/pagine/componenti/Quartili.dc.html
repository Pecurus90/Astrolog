<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>[data-sc-name^="componenti/"]{display:contents}</style></helmet>
<div class="al-c-quartili__blocco-1"><div aria-hidden="true" class="{{ cls }}"><div class="al-quartili__traccia"></div><sc-if value="{{ soglia }}" hint-placeholder-val="{{ false }}"><div class="al-quartili__soglia" style="left:{{ soglia }}"></div></sc-if><div class="al-quartili__banda" style="left:{{ q1 }};width:{{ qw }}"></div><div class="al-quartili__mediana" style="left:{{ m }}"></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:40},&quot;q1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;25%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dati&quot;},&quot;qw&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dati&quot;},&quot;m&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;42%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dati&quot;},&quot;soglia&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Dati&quot;},&quot;misura&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normale&quot;,&quot;piccola&quot;],&quot;default&quot;:&quot;normale&quot;,&quot;tsType&quot;:&quot;'normale' | 'piccola'&quot;,&quot;section&quot;:&quot;Forma&quot;}}">
class Component extends DCLogic {
  // La misura di molti frame su una riga: traccia, banda dal primo al terzo quartile, segno della mediana, soglia tratteggiata se c'e'.
  // Le posizioni arrivano in % dai dati; colori e misure stanno nel foglio (al-quartili, --piccolo per le righe dense).
  renderVals() {
    const p = this.props;
    return { cls: 'al-quartili' + (p.misura === 'piccola' ? ' al-quartili--piccolo' : ''), q1: p.q1 ?? '25%', qw: p.qw ?? '30%', m: p.m ?? '42%', soglia: p.soglia || '' };
  }
}
</script>
</body>
</html>
