<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>[data-sc-name^="componenti/"]{display:contents}</style></helmet>
<div class="al-c-menu__blocco-1" data-modo="{{ t.modo }}" data-accento="{{ t.acc }}">
<sc-if value="{{ pronto }}" hint-placeholder-val="{{ true }}"><div class="al-c-menu__colonna-1" data-menu="1" role="menu" aria-label="{{ aria }}" style="position:{{ pos }};top:{{ top }};left:{{ left }};right:{{ right }};bottom:{{ bottom }};margin:{{ margin }};width:{{ w }};box-shadow:{{ ombra }}">
<sc-if value="{{ sc.on }}" hint-placeholder-val="{{ false }}"><div class="al-c-menu__colonna-2" role="group" aria-label="Scansione"><span class="al-c-menu__riga-1"><b class="al-c-menu__testo-1">{{ sc.titolo }}</b><span class="al-c-menu__testo-2">{{ sc.fase }}</span></span><sc-if value="{{ sc.barra }}" hint-placeholder-val="{{ false }}"><span class="al-c-menu__riga-2" role="progressbar" aria-valuenow="{{ sc.n }}" aria-valuemin="0" aria-valuemax="100"><span class="al-c-menu__pillola-1" style="width:{{ sc.pct }}"></span></span></sc-if><span class="al-c-menu__testo-3">{{ sc.riga }}</span><a class="al-c-menu__riga-3" href="#" role="menuitem" onClick="{{ sc.premi }}" style="min-height:{{ sc.bh }};background:{{ sc.bBg }};color:{{ sc.bFg }}">{{ sc.bottone }}</a><sc-if value="{{ sc.dettagli }}" hint-placeholder-val="{{ false }}"><a class="al-c-menu__riga-4" href="{{ sc.dettagli }}" role="menuitem" style="min-height:{{ sc.bh }}">Dettagli</a></sc-if></div></sc-if>
<sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}"><sc-for list="{{ voci }}" as="ai" hint-placeholder-count="3"><a class="al-c-menu__riga-5" href="{{ ai.href }}" role="menuitem" onClick="{{ ai.on }}"><svg class="al-c-menu__grafico-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ai.d }}"></path></svg><span class="al-c-menu__colonna-3"><span class="al-c-menu__testo-4">{{ ai.l }}</span><span class="al-c-menu__testo-2">{{ ai.s }}</span></span></a></sc-for></sc-if>
<sc-if value="{{ tel }}" hint-placeholder-val="{{ false }}"><sc-for list="{{ voci }}" as="ai" hint-placeholder-count="7"><a class="al-c-menu__riga-6" href="{{ ai.href }}" role="menuitem" onClick="{{ ai.on }}"><svg class="al-c-menu__grafico-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{ ai.d }}"></path></svg><span class="al-c-menu__testo-5">{{ ai.l }}</span></a></sc-for></sc-if>
</div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;altro&quot;,&quot;impostazioni&quot;,&quot;altro telefono&quot;],&quot;default&quot;:&quot;altro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Menu&quot;},&quot;scansione&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ferma&quot;,&quot;in corso&quot;,&quot;interrotta&quot;,&quot;bloccata&quot;],&quot;default&quot;:&quot;ferma&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Menu&quot;},&quot;statico&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Menu&quot;},&quot;onModo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(modo: string) =&amp;gt; void&quot;},&quot;modo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scuro&quot;,&quot;chiaro&quot;],&quot;default&quot;:&quot;scuro&quot;,&quot;tsType&quot;:&quot;'scuro' | 'chiaro'&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;accento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;originale&quot;,&quot;ambra · blu notte&quot;,&quot;turchese · petrolio&quot;,&quot;corallo · terracotta&quot;,&quot;ghiaccio · indaco&quot;],&quot;default&quot;:&quot;ambra · blu notte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { this._alw && clearInterval(this._alw); }
  alPronto() { const ok = () => window.AL && window.ALsoglie && window.ALcat && window.ALdati; if (ok()) return true;
    const b = /\/componenti\/[^/]*$/.test(location.pathname) ? './' : './componenti/';
    ['tema.js', 'soglie.js', 'catalogo.js', 'dati.js'].forEach(f => { if (!document.querySelector('script[data-al="' + f + '"]')) { const s = document.createElement('script'); s.src = b + f; s.setAttribute('data-al', f); document.head.appendChild(s); } });
    if (!this._alw) this._alw = setInterval(() => { if (ok()) { clearInterval(this._alw); this._alw = null; this.forceUpdate(); } }, 25);
    return false; }
  renderVals() {
    if (!this.alPronto()) return { pronto: false };
    const p = this.props, modo = p.modo || 'scuro', t = AL.tema(modo, p.accento), dk = modo === 'scuro';
    const tipo = p.tipo || 'altro', tel = tipo === 'altro telefono', st = !!p.statico;
    const IC = { plan: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', carta: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4l-5.3 3 1.2-6-4.5-4.1 6-.7z', attr: 'M3 14l12-6 2 4-12 6zM15 8l3-1.5 2 4-3 1.5M9 16l-2 5M11 15l2 6',
      imp: 'M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4', proj: 'M12 3v3M12 18v3M3 12h3M18 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', stat: 'M5 20v-9M12 20V5M19 20v-7M3 20h18',
      sun: 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4', moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z' };
    const no = e => e && e.preventDefault();
    // Scansione: puo' durare ore, resta visibile e fermabile da ogni pagina (dati simulati)
    const scs = p.scansione || 'ferma', imp = tipo === 'impostazioni', tb = tel ? '44px' : '36px';
    const SC = { 'in corso': { titolo: 'Scansione in corso', fase: 'Lettura dei file', barra: true, n: 19, riga: 'file letti 3412 su 18 430 · ancora circa 1 h 20', bottone: 'Interrompi', bBg: t.card, bFg: t.text },
      interrotta: { titolo: '! Scansione interrotta', fase: 'oggi, 09:40', barra: true, n: 19, riga: 'Interrotta a mano: 3412 file letti su 18 430. Riprende da dove si era fermata.', bottone: 'Riprendi', bBg: t.accent, bFg: t.hPillFg },
      bloccata: { titolo: '! Scansione bloccata', fase: 'oggi, 09:52', barra: false, n: 0, riga: 'Lettura di una cartella non completata. Controlla il disco e riprova. 3412 file letti su 18 430.', bottone: 'Riprova', dettagli: 'Impostazioni.dc.html?sezione=scansioni', bBg: t.accent, bFg: t.hPillFg } };
    const sc0 = SC[scs], sc = sc0 && (imp || tel) ? { on: true, ...sc0, pct: sc0.n + '%', bh: tb, premi: no } : { on: false };
    const voci = tipo === 'impostazioni' ? (sc0 ? [] : [
        { l: 'Scansiona', s: 'ultima scansione oggi, 07:12 · 214 file nuovi, nessun problema', d: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4' }]).concat([
        { l: 'Modo automatico', s: 'scuro dal tramonto all\u0027alba', d: 'M12 3a9 9 0 1 0 0 18V3z' },
        { l: 'Tutte le impostazioni', s: 'siti, tema, cartelle, servizi', d: IC.imp } ])
      : tel ? [['Progetti', IC.proj], ['Statistiche', IC.stat], ['Planner', IC.plan], ['Piano della notte', 'M4 7h7M14 7h6M4 12h11M18 12h2M4 17h3M10 17h10'], ['Carta del cielo', IC.carta], ['Selezione dei frame', 'M4 5h16v14H4zM4 15l4-4 3 3 4-5 5 6M8 9h.01'], ['Attrezzatura', IC.attr]].map(([l, d]) => ({ l, d, on: no }))
          .concat([{ l: dk ? 'Passa al modo chiaro' : 'Passa al modo scuro', d: dk ? IC.sun : IC.moon, on: e => { no(e); p.onModo && p.onModo(dk ? 'chiaro' : 'scuro'); } }, { l: 'Impostazioni', d: IC.imp, on: no }])
      : [ { l: 'Piano della notte', s: 'cosa si fa stanotte, in che ordine', d: 'M4 7h7M14 7h6M4 12h11M18 12h2M4 17h3M10 17h10' }, { l: 'Planner', s: 'cosa riprendere e come: cielo profondo, Sistema solare, eventi', d: IC.carta }, { l: 'Selezione dei frame', s: 'prima dello stacking: togli i frame inutili', d: 'M4 5h16v14H4zM4 15l4-4 3 3 4-5 5 6M8 9h.01' }, { l: 'Attrezzatura', s: 'telescopi, camere, filtri', d: IC.attr } ];
    // Le pagine che ci sono si aprono; le altre restano senza link
    const PAG = { Statistiche: 'Statistiche.dc.html', 'Piano della notte': 'Piano della notte.dc.html', Planner: 'Planner.dc.html', Attrezzatura: 'Attrezzatura.dc.html', 'Selezione dei frame': 'Selezione dei frame.dc.html', Progetti: 'Progetti.dc.html', Impostazioni: 'Impostazioni.dc.html', 'Tutte le impostazioni': 'Impostazioni.dc.html' };
    voci.forEach(v => { if (PAG[v.l]) { v.href = PAG[v.l]; v.on = undefined; } else { v.href = '#'; if (!v.on) v.on = no; } });
    const P = st ? { pos: 'relative', top: 'auto', left: 'auto', right: 'auto', bottom: 'auto', margin: '0', w: 'auto' }
      : tel ? { pos: 'sticky', top: 'auto', left: 'auto', right: 'auto', bottom: '84px', margin: '0 12px -8px', w: 'auto' }
      : tipo === 'impostazioni' ? { pos: 'absolute', top: 'calc(100% + 10px)', left: 'auto', right: '0', bottom: 'auto', margin: '0', w: '290px' }
      : { pos: 'absolute', top: 'calc(100% + 12px)', left: '-8px', right: 'auto', bottom: 'auto', margin: '0', w: '260px' };
    return { pronto: true, t, sc, ...P, desk: !tel, tel, voci, aria: tipo === 'impostazioni' ? 'Impostazioni' : 'Altre pagine', ombra: tel ? '0 -12px 40px rgba(0,0,0,.3)' : '0 16px 40px rgba(0,0,0,.25)' };
  }
}
</script>
</body>
</html>
