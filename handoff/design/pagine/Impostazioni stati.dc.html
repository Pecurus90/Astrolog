<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="caratteri.css" rel="stylesheet">
<link href="astrolog.css" rel="stylesheet">
<style>html,body{margin:0;background:var(--tavola-fondo)}a{color:inherit}a:hover{opacity:.8}</style>
</helmet>
<section style="display:flex;flex-direction:column;gap:120px;padding:80px;min-width:max-content;background:var(--tavola-fondo);font-family:'Outfit',sans-serif">
<div style="display:flex;flex-direction:column;gap:32px">
<span style="font-size:30px;font-weight:500;color:var(--tavola-testo)">Impostazioni, gli stati · telefono 390 px</span>
<span style="font-size:15px;color:var(--tavola-tenue);max-width:900px">Ogni schermo si accende quando entra nella vista. Gli stati del brief 9 (v68): siti, il cielo del sito, cartelle, ASTAP, servizi, backup. Dati simulati.</span>
<sc-for list="{{ righeTel }}" as="riga" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:20px"><span style="font-size:22px;font-weight:500;color:var(--tavola-testo)">{{ riga.titolo }}</span><div style="display:flex;gap:56px;align-items:flex-start">
<sc-for list="{{ riga.voci }}" as="it" hint-placeholder-count="6"><div data-screen-label="{{ it.label }}" ref="{{ it.ref }}" style="display:flex;flex-direction:column;gap:10px;flex:none;width:390px"><span style="font-size:18px;font-weight:500;color:var(--tavola-testo)">{{ it.titolo }}</span><span style="font-size:14px;color:var(--tavola-tenue);min-height:40px">{{ it.nota }}</span><div style="width:390px;min-height:844px;overflow:hidden;border-radius:44px;box-shadow:0 0 0 10px var(--tavola-cornice), 0 30px 60px rgba(0,0,0,.4);background:var(--tavola-schermo);display:flex;flex-direction:column"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><dc-import name="Impostazioni" sezione="{{ it.sez }}" sito="{{ it.sito }}" stato="{{ it.stato }}" astap="{{ it.astap }}" cartelle="{{ it.cart }}" modo="{{ it.modo }}" accento="{{ it.acc }}" formato="telefono" hint-size="390px,844px"></dc-import></sc-if></div></div></sc-for>
</div></div></sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:24px">
<span style="font-size:30px;font-weight:500;color:var(--tavola-testo)">Desktop · 1440 px</span>
<div style="display:flex;flex-wrap:wrap;gap:80px;align-items:flex-start;max-width:4560px">
<sc-for list="{{ desk }}" as="it" hint-placeholder-count="6"><div data-screen-label="{{ it.label }}" ref="{{ it.ref }}" style="display:flex;flex-direction:column;gap:16px;width:1440px;min-height:900px;flex:none"><div style="display:flex;gap:12px;align-items:baseline;color:var(--tavola-testo)"><span style="font-size:22px;font-weight:500">{{ it.titolo }}</span><span style="font-size:15px;color:var(--tavola-tenue)">{{ it.nota }}</span></div><div style="border-radius:20px;overflow:hidden;min-height:900px;background:var(--tavola-schermo);display:flex;flex-direction:column"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><dc-import name="Impostazioni" sezione="{{ it.sez }}" sito="{{ it.sito }}" stato="{{ it.stato }}" astap="{{ it.astap }}" cartelle="{{ it.cart }}" modo="{{ it.modo }}" accento="{{ it.acc }}" formato="desktop" hint-size="1440px,900px"></dc-import></sc-if></div></div></sc-for>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: {} };
  refs = {}; els = {};
  componentDidMount() {
    this._io = typeof IntersectionObserver !== 'undefined' ? new IntersectionObserver(es => {
      const add = {}; es.forEach(e => { if (e.isIntersecting) add[e.target.dataset.k] = true; });
      if (Object.keys(add).length) this.setState(s => ({ on: { ...s.on, ...add } }));
    }, { rootMargin: '300px' }) : null;
    Object.values(this.els).forEach(el => this.osserva(el));
    if (!this._io) this.setState({ on: new Proxy({}, { get: () => true }) });
  }
  componentWillUnmount() { this._io && this._io.disconnect(); }
  osserva(el) { if (el instanceof Element && this._io && !el._oss) { el._oss = 1; this._io.observe(el); } }
  rif(k) { if (!this.refs[k]) this.refs[k] = el => { if (!el) return; el.dataset.k = k; this.els[k] = el; this.osserva(el); }; return this.refs[k]; }
  renderVals() {
    // [titolo, nota, sezione, sito, stato, astap, cartelle, modo, accento]
    const R = [
      ['Siti', [['Proposta del Bortle', 'le misure dicono 4, nel sito c\u0027è 3', 'Siti'], ['Dati scarsi', 'Casa: 5 notti in 2 mesi', 'Siti', 'Casa · dati scarsi'], ['Sito senza cielo', 'Passo Coe: Usa · Lascia vuoto', 'Siti', 'Passo Coe · senza cielo'],
        ['SQM a mano', 'la classe dalla tabella di ASTAP', 'Siti', 'Cielo · SQM a mano'], ['Dalla mappa, senza chiave', 'porta a Servizi', 'Siti', 'Cielo · dalla mappa, senza chiave'], ['Rinomina', '', 'Siti', 'Rinomina']]],
      ['Nuovo sito ed Elimina', [['Per nome', 'risultato scelto, altitudine dal terreno', 'Siti', 'Aggiungi · per nome'], ['Per coordinate', '', 'Siti', 'Aggiungi · per coordinate'], ['Nessun luogo', '', 'Siti', 'Aggiungi · nessun luogo'], ['Elimina', 'sito senza notti, conferma nella carta', 'Siti', 'Elimina · sito senza notti']]],
      ['Generale, cartelle, Meteo, ASTAP', [['Generale', 'con la Lingua', 'Generale'], ['Cartella non raggiungibile', 'i frame restano', 'Cartelle e scansione', '', '', '', 'una non raggiungibile'], ['Meteo', 'Sole spento, la chiave in Servizi', 'Meteo'],
        ['ASTAP, più cataloghi', 'D50 consigliato', 'ASTAP', '', '', 'più cataloghi'], ['ASTAP, nessun catalogo', '', 'ASTAP', '', '', 'catalogo mancante'], ['Automazione', 'per postazione, cioè per montatura', 'Automazione']]],
      ['Servizi e Backup', [['Servizi', 'con il servizio del cielo', 'Servizi'], ['Servizi, chiave rifiutata', '', 'Servizi', '', 'rifiutata'], ['Backup', 'risposte e impostazioni', 'Backup'], ['File illeggibile', '', 'Backup', '', 'file illeggibile'], ['Ripristino non riuscito', '', 'Backup', '', 'ripristino non riuscito'], ['Modo chiaro', 'corallo · terracotta', 'Siti', '', '', '', '', 'chiaro', 'corallo · terracotta']]]];
    const on = this.state.on; let n = 0;
    const voce = (pre, [titolo, nota, sez, sito, stato, astap, cart, modo, acc]) => { const k = pre + (n++);
      return { titolo, nota: nota || '', sez, sito: sito || 'Cima Ekar', stato: stato || 'normale', astap: astap || 'installato', cart: cart || 'tutte raggiungibili', modo: modo || 'scuro', acc: acc || 'ambra · blu notte', label: (pre === 't' ? 'Telefono · ' : 'Desktop · ') + titolo, ref: this.rif(k), on: !!on[k] }; };
    const righeTel = R.map(([titolo, v]) => ({ titolo, voci: v.map(x => voce('t', x)) }));
    const D = [['Siti', 'proposta del Bortle', 'Siti'], ['Sito senza cielo', '', 'Siti', 'Passo Coe · senza cielo'], ['Nuovo sito', 'per nome', 'Siti', 'Aggiungi · per nome'], ['Cartelle', 'una non raggiungibile', 'Cartelle e scansione', '', '', '', 'una non raggiungibile'], ['ASTAP', 'più cataloghi', 'ASTAP', '', '', 'più cataloghi'], ['Generale', 'con la Lingua', 'Generale'],
      ['Servizi', '', 'Servizi'], ['Backup', 'file illeggibile', 'Backup', '', 'file illeggibile'], ['Modo chiaro', 'ghiaccio · indaco', 'Siti', '', '', '', '', 'chiaro', 'ghiaccio · indaco']];
    return { righeTel, desk: D.map(x => voce('d', x)) };
  }
}
</script>
</body>
</html>
