<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="caratteri.css" rel="stylesheet">
<link href="astrolog.css" rel="stylesheet">
<style>html,body{margin:0;background:var(--tavola-fondo)}a{color:inherit}a:hover{opacity:.8}</style>
</helmet>
<section style="display:flex;flex-direction:column;gap:120px;padding:80px;min-width:max-content;background:var(--tavola-fondo);font-family:'Outfit',sans-serif">
<div style="display:flex;flex-direction:column;gap:32px">
<span style="font-size:30px;font-weight:500;color:var(--tavola-testo)">Notti, gli stati · telefono 390 px</span>
<span style="font-size:15px;color:var(--tavola-tenue);max-width:900px">Ogni schermo si accende quando entra nella vista, così la tavola resta leggera. Oggi è mercoledì 30 settembre 2026, come in Dashboard e Meteo; dati del vecchio sistema, simulati.</span>
<sc-for list="{{ righeTel }}" as="riga" hint-placeholder-count="2"><div style="display:flex;gap:56px;align-items:flex-start">
<sc-for list="{{ riga }}" as="it" hint-placeholder-count="8"><div data-screen-label="{{ it.label }}" ref="{{ it.ref }}" style="display:flex;flex-direction:column;gap:10px;flex:none;width:390px"><span style="font-size:18px;font-weight:500;color:var(--tavola-testo)">{{ it.titolo }}</span><span style="font-size:14px;color:var(--tavola-tenue);min-height:40px">{{ it.nota }}</span><div style="width:390px;height:844px;overflow-y:auto;overflow-x:hidden;border-radius:44px;box-shadow:0 0 0 10px var(--tavola-cornice), 0 30px 60px rgba(0,0,0,.4);background:var(--tavola-schermo)"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><dc-import name="Notti" stato="{{ it.st }}" modo="{{ it.modo }}" variante="{{ it.variante }}" dettaglio="{{ it.det }}" formato="telefono" hint-size="390px,844px"></dc-import></sc-if></div></div></sc-for>
</div></sc-for>
</div>
<div style="display:flex;flex-direction:column;gap:24px">
<span style="font-size:30px;font-weight:500;color:var(--tavola-testo)">Desktop · 1440 px</span>
<div style="display:flex;gap:80px;align-items:flex-start">
<sc-for list="{{ desk }}" as="it" hint-placeholder-count="4"><div data-screen-label="{{ it.label }}" ref="{{ it.ref }}" style="display:flex;flex-direction:column;gap:16px;width:1440px;min-height:1700px;flex:none"><div style="display:flex;gap:12px;align-items:baseline;color:var(--tavola-testo)"><span style="font-size:22px;font-weight:500">{{ it.titolo }}</span><span style="font-size:15px;color:var(--tavola-tenue)">{{ it.nota }}</span></div><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><dc-import name="Notti" stato="{{ it.st }}" modo="{{ it.modo }}" dettaglio="{{ it.det }}" formato="desktop" hint-size="1440px,1700px"></dc-import></sc-if></div></sc-for>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { on: {} };
  refs = {};
  componentDidMount() {
    this._io = typeof IntersectionObserver !== 'undefined' ? new IntersectionObserver(es => {
      const add = {}; es.forEach(e => { if (e.isIntersecting) add[e.target.dataset.k] = true; });
      if (Object.keys(add).length) this.setState(s => ({ on: { ...s.on, ...add } }));
    }, { rootMargin: '300px' }) : null;
    Object.values(this.els).forEach(el => this.osserva(el));
    if (!this._io) this.setState({ on: new Proxy({}, { get: () => true }) });
  }
  componentWillUnmount() { this._io && this._io.disconnect(); }
  els = {};
  osserva(el) { if (el instanceof Element && this._io && !el._oss) { el._oss = 1; this._io.observe(el); } }
  rif(k) { if (!this.refs[k]) this.refs[k] = el => { if (!el) return; el.dataset.k = k; this.els[k] = el; this.osserva(el); }; return this.refs[k]; }
  renderVals() {
    const T = [['normale', 'la striscia delle notti; il calendario si apre'], ['caricamento', 'lo scheletro ha le misure delle carte vere'], ['errore', 'le notti non arrivano: una frase, un\u0027azione'], ['nessuna cartella', 'nessuna cartella scelta: il primo dei quattro modi di non avere notti'], ['nessun frame', 'le cartelle non hanno frame'], ['senza sito', 'la notte è una data più un sito'], ['prima lettura', 'la prima lettura è al lavoro: nessuna azione'], ['frame fermi su una risposta', 'tutti i frame aspettano Da confermare'], ['tutte le righe di stato', 'una riga per motivo, in fondo sotto i totali'],
      ['una notte sola', 'dall\u0027indirizzo, come la apre Cerca'], ['notte che non c\u0027è più', 'i frame sono stati rimossi o spostati'], ['sito senza fuso', 'la Luna tace, il meteo non si può sapere'], ['meteo che non arriva', 'il servizio non ha risposto: niente data'], ['senza durata', 'nel file non c\u0027è la durata'], ['due siti lo stesso giorno', '19 settembre: due notti, due segni nel giorno, due caselle'], ['senza buio', 'Lofoten a giugno: ore utili col Sole sotto l\u0027orizzonte'], ['normale', 'modo chiaro, accento blu notte', 'chiaro'], ['due siti lo stesso giorno', 'il riepilogo della notte a pagina intera', '', 'A', 'aperto']];
    const on = this.state.on;
    const tel = T.map(([st, nota, modo, variante, det], i) => { const k = 't' + i, nn = String(i + 1).padStart(2, '0');
      return { st, nota, modo, variante: variante || 'A', det: det || 'chiuso', titolo: nn + ' · ' + st + (modo ? ' · ' + modo : ''), label: 'Telefono · ' + nn + ' · ' + st, ref: this.rif(k), on: !!on[k] }; });
    const D = [['normale', 'modo chiaro', 'chiaro'], ['due siti lo stesso giorno', 'il riepilogo della notte in finestra', '', 'aperto'], ['tutte le righe di stato', 'quattro motivi in testa'], ['una notte sola', 'niente calendario, niente elenco']];
    const desk = D.map(([st, nota, modo, det], i) => { const k = 'd' + i; return { st, nota, modo, det: det || 'chiuso', titolo: st + (modo ? ' · ' + modo : ''), label: 'Desktop · ' + st, ref: this.rif(k), on: !!on[k] }; });
    return { righeTel: [tel.slice(0, 9), tel.slice(9)], desk };
  }
}
</script>
</body>
</html>
