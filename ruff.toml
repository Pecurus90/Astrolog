# Il linter, una casa sola per tutto il repo: il backend e gli strumenti del metodo.
# `old/` non si misura (e' la cava, si porta e si cancella) e `node_modules` non e' nostro.
line-length = 100
target-version = "py312"
extend-exclude = ["old", "node_modules"]
# Dove stanno i nostri pacchetti: senza questo `astrolog` finirebbe fra le librerie di
# terzi e l'ordine degli import cambierebbe in tutto il repo.
src = ["backend", "backend/tests", "tools"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DTZ", "S", "BLE", "T20", "SIM",
          "C901", "PLR0912", "PLR0913", "PLR0915", "PLE25",
          "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
# C901/PLR: limits on functions, not files. Existing breaches carry a `noqa`: that is the debt.
# PLE25: control characters (backspace, NUL, ESC...) pasted into strings.
# DTZ: le date portano il fuso (CLAUDE.md). BLE: niente `except Exception` muti. T20: niente
# print. S: le prese di sicurezza, S608 (SQL composto con stringhe) e S105 (segreti scritti
# nel codice) comprese. N: nomi in inglese, PEP 8.
# B008 e' l'idioma di FastAPI (`Depends` nel default): non e' un difetto.
ignore = ["S101", "B008"]

[lint.per-file-ignores]
# ANN: every function annotated, only where the refactor has passed; the glob widens with it.
"!{backend/astrolog/spine/identify*.py,backend/astrolog/spine/__init__.py,backend/astrolog/spine/scan.py,backend/astrolog/spine/scan_store.py,backend/astrolog/spine/frame_folder.py,backend/astrolog/spine/inventory.py,backend/astrolog/spine/header_asks.py,backend/astrolog/spine/copies.py,backend/astrolog/spine/coordinates.py,backend/astrolog/spine/rewrite.py,backend/astrolog/spine/normalize.py,backend/astrolog/spine/normalize_store.py,backend/astrolog/spine/normalize_rig.py,backend/astrolog/spine/stages.py,backend/astrolog/spine/stage_run.py,backend/astrolog/spine/run.py,backend/astrolog/spine/counts.py,backend/astrolog/spine/solve.py,backend/astrolog/spine/solve_store.py,backend/astrolog/spine/group.py,backend/astrolog/spine/group_store.py,backend/astrolog/spine/typeless.py,backend/astrolog/spine/typeless_answer.py,backend/astrolog/spine/typeless_folders.py,backend/astrolog/spine/home_nights.py,backend/astrolog/spine/gear.py,backend/astrolog/spine/gear_create.py,backend/astrolog/spine/gear_usage.py,backend/astrolog/spine/rigs.py,backend/astrolog/spine/rig_optics.py,backend/astrolog/spine/camera_specs.py,backend/astrolog/spine/camera_sky.py,backend/astrolog/spine/filters_used.py,backend/astrolog/db/*.py,backend/astrolog/vocab/*.py,backend/astrolog/catalog/*.py,backend/astrolog/fits/*.py,backend/astrolog/ephemeris/*.py,backend/astrolog/worker/*.py,backend/astrolog/weather/*.py,backend/astrolog/__init__.py,backend/astrolog/__main__.py,backend/astrolog/astap.py,backend/astrolog/clock.py,backend/astrolog/log.py,backend/astrolog/net.py,backend/astrolog/place.py,backend/astrolog/startup.py,backend/astrolog/units.py}" = ["ANN"]
# Nei test: `assert` e' il mestiere, i percorsi temporanei sono voluti, i sottoprocessi si
# lanciano apposta. I segreti scritti nel codice NO: quella presa resta accesa anche qui,
# perche' una finta password in un test finisce nella storia come una vera.
"backend/tests/**" = ["S101", "S108", "S311", "S603", "S607", "DTZ", "PLR0913", "C901", "PLR0912", "PLR0915"]
# Gli strumenti sono programmi da riga di comando: stampare e' come parlano, e lanciare
# processi (ruff, pytest, git) e' cio' per cui esistono.
"tools/**" = ["T20", "S603", "S607"]
