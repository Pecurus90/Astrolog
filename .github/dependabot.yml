# Chi sorveglia le dipendenze. Senza questo file una libreria puo' restare ferma per anni,
# falle comprese, e nessuno se ne accorge: qui ogni mese arriva una proposta di aggiornamento,
# che passa dalla CI; patch e minori si uniscono da soli a CI verde (automerge.yml, ADR 0040).
#
# Vincolo non ovvio: le proposte si raggruppano in una sola per ecosistema. Dieci richieste
# separate al mese non si guardano; una sola, con dentro tutto, si guarda davvero.
# Nel gruppo solo minori e patch: una maggiore rompe da sola (typescript 7 nel gruppo di
# ottobre teneva rossa l'intera proposta) e arriva in una proposta sua.
# Attesa sulle versioni appena uscite: i giorni dell'esempio di GitHub (docs, "Optimizing the
# creation of pull requests for Dependabot version updates", cooldown).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    cooldown: {default-days: 5, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3}
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /frontend
    cooldown: {default-days: 5, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3}
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7.13 vuole typescript ^5: si toglie quando lo accetta.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    cooldown: {default-days: 5, semver-major-days: 30, semver-minor-days: 7, semver-patch-days: 3}
    schedule:
      interval: monthly
    groups:
      azioni:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3
