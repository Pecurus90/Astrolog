# Slow checks that do not belong on every commit: mutation testing and the CI on Windows.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  mutation:
    # The whole backend in one job overruns the job limit; see docs/adr/0001-metodo-standard.md.
    strategy:
      fail-fast: false
      matrix:
        shard: [api, spine-a-m, spine-n-z, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]" mutmut
      # A step limit below the job's, so a shard cut short still leaves time for its report.
      - name: Mutants of shard ${{ matrix.shard }}
        timeout-minutes: 280
        run: |
          patterns="$(python ../tools/mutation_shards.py ${{ matrix.shard }})"
          set -f
          mutmut run --max-children 4 $patterns
      # Killed ones included, so a shard that owns no mutant in the report fails instead of
      # looking clean; a shard cut short lists its own unrun mutants as "not checked".
      - name: Surviving mutants (tests that do not notice a change)
        if: always()
        run: |
          mutmut results --all true > results.txt
          python ../tools/mutation_shards.py ${{ matrix.shard }} --filter < results.txt

  # The full CI, Windows included: a push skips the Windows runner.
  ci:
    uses: ./.github/workflows/ci.yml

  # GitHub tells only who wrote the cron: a red night becomes an Issue, a green one closes it.
  signal:
    needs: [mutation, ci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Issue nightly-rosso
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/nightly_issue.py "${{ needs.mutation.result == 'success' && needs.ci.result == 'success' && 'success' || 'failure' }}"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
