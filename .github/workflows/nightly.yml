# Slow checks that do not belong on every commit: mutation testing and the CI on Windows.
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Read only; the signal job alone also writes Issues.
permissions:
  contents: read

jobs:
  mutation:
    # The whole backend in one job overruns the job limit; see docs/adr/0001-metodo-standard.md.
    strategy:
      fail-fast: false
      matrix:
        shard: [api, spine-a-m, spine-n-z, rest]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e ".[dev]" mutmut
      # mutmut resumes from mutants/ and retests only changed functions: each night goes on
      # from the last one, so a shard too long for one job finishes over several.
      - uses: actions/cache/restore@v6
        with:
          path: backend/mutants
          key: mutants-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: mutants-${{ matrix.shard }}-
      # A step limit below the job's, so a shard cut short still saves and reports.
      - name: Mutants of shard ${{ matrix.shard }}
        timeout-minutes: 270
        run: |
          patterns="$(python ../tools/mutation_shards.py ${{ matrix.shard }})"
          set -f
          mutmut run --max-children 4 $patterns
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: backend/mutants
          key: mutants-${{ matrix.shard }}-${{ github.run_id }}
      # Killed ones included, so a shard that owns no mutant in the report fails instead of
      # looking clean; red only when the score falls under tools/mutation_reference.json.
      - name: Surviving mutants (tests that do not notice a change)
        if: always()
        run: |
          mutmut results --all true > results.txt
          python ../tools/mutation_shards.py ${{ matrix.shard }} --filter < results.txt

  # The frontend with StrykerJS; incremental, so a night retests only what changed.
  mutation-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v6
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-${{ github.run_id }}
          restore-keys: stryker-
      # In place: a test reads ../backend, which Stryker's sandbox copy does not hold.
      - name: Mutants of the frontend
        timeout-minutes: 270
        run: npx stryker run --inPlace
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-${{ github.run_id }}
      - name: Frontend score against the reference
        if: always()
        # the incremental file, not mutation.json: Stryker writes it on a cut run too
        run: python ../tools/mutation_shards.py frontend --filter < reports/stryker-incremental.json

  # The full CI, Windows included: a push skips the Windows runner.
  ci:
    uses: ./.github/workflows/ci.yml

  # GitHub tells only who wrote the cron: a red night becomes an Issue, a green one closes it.
  signal:
    needs: [mutation, mutation-frontend, ci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Issue nightly-rosso
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/nightly_issue.py "${{ needs.mutation.result == 'success' && needs.mutation-frontend.result == 'success' && needs.ci.result == 'success' && 'success' || 'failure' }}"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
