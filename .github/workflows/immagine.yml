# The NAS image (Dockerfile): built natively on amd64 and arm64, published as one multi-arch tag.
# Tag `anteprima` only, never `latest`, until the first release (Marco 18/11/2026).
name: Immagine

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: immagine
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pecurus90/astrolog

jobs:
  build:
    name: immagine (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: L'app parte nell'immagine e risponde
        run: |
          docker run -d --name prova -p 8765:8765 -e ASTROLOG_HOSTS=localhost \
            --entrypoint python "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" -m astrolog
          for i in $(seq 30); do curl -fs -o /dev/null http://localhost:8765/ && break; sleep 2; done
          curl -fsS -o /dev/null -w "pagina %{http_code}\n" http://localhost:8765/
          docker exec prova sh -c '/opt/astap/astap_cli -h || true' | head -3
      - name: Digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          d="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: immagine multi-arch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Un'etichetta per le due architetture
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:anteprima" -t "$IMAGE:anteprima-${GITHUB_SHA::8}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:anteprima"
